[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "coi"
version = "0.2.0"
description = "Compute the Cyanobacteria Occurrence Index (COI) from satellite water reflectance"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Davide Lomeo", email = "davide.lomeo@kcl.ac.uk" }]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.20",
    "pandas>=1.3",
    "xarray>=0.20",
    "netCDF4",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
dask = ["dask"]
test = ["pytest", "dask"]

[project.scripts]
coi = "coi.cli:main"

[project.urls]
Homepage = "https://github.com/davidelomeo/coi"

[tool.setuptools]
packages = ["coi"]

[tool.setuptools.package-data]
coi = ["core_files/*"]
