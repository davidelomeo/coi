[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "coi"
version = "0.4.0"
description = "Compute the Cyanobacteria Occurrence Index (COI) from satellite water reflectance"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Davide Lomeo", email = "davide.lomeo@kcl.ac.uk" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "xarray>=2024.7",
    "netCDF4>=1.7",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
dask = ["dask[array]"]
test = ["pytest>=8", "dask[array]"]

[project.scripts]
coi = "coi.cli:main"

[project.urls]
Homepage = "https://github.com/davidelomeo/coi"

[tool.setuptools]
packages = ["coi"]

[tool.setuptools.package-data]
coi = ["core_files/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "NPY", "RUF"]
